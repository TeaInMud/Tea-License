<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea License 2.0 Builder 🍵</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .builder-form { background: #faf6ed; padding: 1.5rem; border-radius: 10px; margin: 2rem 0; }
        .builder-form input { display: block; width: 100%; padding: 0.6rem; margin: 0.5rem 0 1rem; border: 1px solid #dcc8a0; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        .builder-form button { background: #8b5e3c; color: #fffef7; border: none; padding: 0.7rem 2rem; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        .builder-form button:hover { background: #6b4530; }
        .license-output { background: #fffef7; border: 1px solid #dcc8a0; border-radius: 8px; padding: 1.5rem; white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 0.9rem; margin-top: 2rem; max-height: 400px; overflow-y: auto; }
        .copy-btn { margin-top: 1rem; background: #6b8c5c; color: white; border: none; padding: 0.5rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .copy-btn:hover { background: #4e6943; }
        #message { margin-left: 1rem; color: #6b8c5c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍵 Tea License 2.0 Builder</h1>
        <p>Generate your personalized Tea License 2.0. Enter your name and year, then copy the text into your project's <code>LICENSE</code> file.</p>

        <div class="builder-form">
            <label for="name">Licensor Name / Organization</label>
            <input type="text" id="name" placeholder="e.g., Jane Doe or TeaCode Inc." required>
            <label for="year">Year</label>
            <input type="text" id="year" placeholder="2026" value="2026" required>
            <button id="generateBtn">🍵 Brew My License</button>
        </div>

        <div id="result" style="display: none;">
            <h2>Your Freshly Steeped License</h2>
            <div class="license-output" id="licenseText"></div>
            <button class="copy-btn" id="copyBtn">📋 Copy to Clipboard</button>
            <span id="message"></span>
        </div>

        <p style="margin-top: 2rem;"><a href="index.html">← Back to Tea License Home</a></p>
    </div>

    <script>
        const licenseTemplate = `The Tea License, Version 2.0 (Tea-2.0)

Copyright (c) {{YEAR}} {{NAME}}

Permission is hereby granted, free of charge, to any person (the "Licensee")
obtaining a copy of this software and associated documentation files (the
"Software"), to deal in the Software without restriction, including without
limitation the rights to use, copy, modify, merge, publish, distribute,
sublicense, and/or sell copies of the Software, and to permit persons to whom
the Software is furnished to do so, subject to the following conditions:

[... full v2 text as provided earlier, with {{YEAR}} and {{NAME}} placeholders ...]`;

        // For brevity in this answer, the full license template from my previous v2 message is intended.
        // Copy the complete v2 license text with the placeholders above and paste it into the template variable.
        // To avoid repetition, I will assume you have the full text from earlier.

        document.getElementById('generateBtn').addEventListener('click', () => {
            const name = document.getElementById('name').value.trim();
            const year = document.getElementById('year').value.trim();
            if (!name || !year) { alert('Please fill in both fields.'); return; }
            const licenseText = licenseTemplate.replace(/\{\{NAME\}\}/g, name).replace(/\{\{YEAR\}\}/g, year);
            document.getElementById('licenseText').textContent = licenseText;
            document.getElementById('result').style.display = 'block';
            document.getElementById('message').textContent = '';
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const text = document.getElementById('licenseText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                document.getElementById('message').textContent = 'Copied! Pairs well with a biscuit. 🍪';
            }).catch(() => {
                document.getElementById('message').textContent = 'Please copy manually.';
            });
        });
    </script>
</body>
</html>
